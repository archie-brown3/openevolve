# Cache replacement policy evolution — local llama.cpp (Qwen3.5-9B, thinking disabled)

max_iterations: 500000
checkpoint_interval: 10
log_level: "INFO"
random_seed: 42

diff_based_evolution: false
max_code_length: 8000

llm:
  models:
    - name: "qwen3.5-9b"          # label only; llama.cpp serves whatever GGUF is loaded
      weight: 1.0
  api_base: "http://127.0.0.1:8080/v1"
  api_key: "EMPTY"               # client needs a non-empty string; llama.cpp ignores it
  temperature: 0.7
  top_p: 0.95
  max_tokens: 1536               # diff for a one-line score() is small; leaves prompt room under -c 8192
  timeout: 180
  retries: 3

prompt:
  num_top_programs: 2            # fewer in-prompt programs → smaller prompt (avoids ctx overflow)
  num_diverse_programs: 1
  include_artifacts: true        # feeds the per-workload hit-rate table back to the LLM
  system_message: |
    You are an expert systems engineer designing cache eviction policies.
    You modify a single Python function:
        score(age, frequency, recency, size, cache_size, now) -> float
    The cache evicts the item with the LOWEST score. Combine recency, frequency and
    age to beat LRU/LFU/ARC across diverse workloads (temporal locality, stable
    frequency, scan, churn). Keep it a short, pure arithmetic expression.

database:
  population_size: 200
  num_islands: 4
  migration_interval: 20
  feature_dimensions:            # must match metric names returned by evaluator.py
    - stable_frequency_hitrate
    - churn_hitrate
  feature_bins: 10

evaluator:
  timeout: 60
  cascade_evaluation: true
  cascade_thresholds: [0.0]      # stage-1 just rejects broken / non-running programs
  parallel_evaluations: 2        # CPU-bound sim; keep modest