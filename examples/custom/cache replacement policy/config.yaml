# Cache replacement policy evolution — local llama.cpp (Qwen3.5-9B, thinking disabled)

max_iterations: 500000
checkpoint_interval: 10
log_level: "INFO"
random_seed: 42

diff_based_evolution: false
max_code_length: 8000

llm:
  models:
    - name: "Meta-Llama-3.1"          # label only; llama.cpp serves whatever GGUF is loaded
      weight: 1.0
  api_base: "http://127.0.0.1:8080/v1"
  api_key: "EMPTY"               # client needs a non-empty string; llama.cpp ignores it
  temperature: 0.7
  top_p: 0.95
  max_tokens: 1536               # diff for a one-line score() is small; leaves prompt room under -c 8192
  timeout: 180
  retries: 3

  # Frontier model for the Reflexion layer (separate pool; does NOT inherit the local api settings above)
  reflexion_models:
    - name: "deepseek-v4-pro"               # set to your DeepSeek model id (V4 Pro id if available)
      api_base: "https://api.deepseek.com/v1"
      api_key: "${DEEPSEEK_API_KEY}"      # resolved from the shell env; `set -a; source .env; set +a` first
      temperature: 0.7
      max_tokens: 2048
      timeout: 180
      weight: 1.0

prompt:
  num_top_programs: 2            # fewer in-prompt programs → smaller prompt (avoids ctx overflow)
  num_diverse_programs: 1
  include_artifacts: true        # feeds the per-workload hit-rate table back to the LLM
  system_message: |
    You are an expert systems engineer designing cache eviction policies.
    You write ONLY the score() function — no other functions, no imports, no simulate().

    Function signature (DO NOT CHANGE):
        def score(age, frequency, recency, size, cache_size, now) -> float:

    Parameters:
      age        = now - insert_time       (0 = just inserted)
      frequency  = total accesses while resident
      recency    = now - last_access_time  (0 = just accessed)
      size       = item size (always 1 in current experiments)
      cache_size = cache capacity (constant within a run)
      now        = current logical timestamp

    Return value: HIGHER = more valuable = keep. The item with the LOWEST score is
    evicted. Returning -recency exactly reproduces LRU (the baseline to beat).

    Fitness = signed skill vs max(LRU, LFU, ARC) averaged across diverse workloads
    (temporal locality, stable frequency, churn). Scan workload excluded (near-saturated).
    Beating LRU/LFU/ARC on MORE workloads WITHOUT regressing others is the goal.

    Return a short arithmetic expression. No comments, no docstring, no helpers.

database:
  population_size: 200
  num_islands: 4
  migration_interval: 20
  feature_dimensions:            # must match metric names returned by evaluator.py
    - stable_frequency_hitrate
    - churn_hitrate
  feature_bins: 10

evaluator:
  timeout: 60
  cascade_evaluation: true
  cascade_thresholds: [0.0]      # stage-1 just rejects broken / non-running programs
  parallel_evaluations: 2        # CPU-bound sim; keep modest

reflexion:
  enabled: true
  stagnation_patience: 8         # per-island iters w/o combined_score improvement before reflecting
  memory_size: 3
  improvement_metric: combined_score
  # embedding_model: text-embedding-3-small   # optional dedup of reflections (needs an OpenAI key)